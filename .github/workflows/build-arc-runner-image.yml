name: Build ARC runner image

# Builds the custom runner image for the arc-linux scale set.
# Runs on GitHub-hosted ubuntu-latest on purpose (chicken-and-egg:
# the scale set can't build its own image).
on:
  push:
    branches: [ci/arc-linux]
    paths:
      - '.github/arc-runner/**'
      - '.github/workflows/build-arc-runner-image.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c

      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .github/arc-runner
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/yicong-huang/texera-arc-runner:latest
            ghcr.io/yicong-huang/texera-arc-runner:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
