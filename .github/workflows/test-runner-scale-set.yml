name: Test runner scale set
on:
  push:
    branches: [test-runner-scale-set]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: arc-linux
    timeout-minutes: 10
    steps:
      - name: Runner info
        run: |
          echo "PATH=$PATH"
          which go || echo "no go"
          ls /home/runner/go/bin 2>/dev/null || echo "no ~/go/bin"
          which license-eye || echo "no license-eye"
          which make psql google-chrome sudo || true
