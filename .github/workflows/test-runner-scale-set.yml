name: Test runner scale set
on:
  push:
    branches: [test-runner-scale-set]
  workflow_dispatch:

permissions:
  actions: write

jobs:
  var-write-test:
    runs-on: ubuntu-latest
    steps:
      - name: Write repo variable with GITHUB_TOKEN
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh api repos/${{ github.repository }}/actions/variables/HEARTBEAT_TEST --jq .value 2>/dev/null; then
            gh api -X PATCH repos/${{ github.repository }}/actions/variables/HEARTBEAT_TEST -f name=HEARTBEAT_TEST -f value="patched-$(date +%s)" && echo "PATCH OK"
          else
            gh api -X POST repos/${{ github.repository }}/actions/variables -f name=HEARTBEAT_TEST -f value="created-$(date +%s)" && echo "POST OK"
          fi
          gh api repos/${{ github.repository }}/actions/variables/HEARTBEAT_TEST --jq '.value'
