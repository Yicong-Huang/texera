# Heavy tier: amber / amber-integration / frontend (sbt + JVM tests).
githubConfigUrl: "https://github.com/Yicong-Huang/Texera"
githubConfigSecret: github-arc-secret
runnerScaleSetName: "arc-heavy-linux"
minRunners: 2
maxRunners: 3

# service containers (postgres) and docker builds need a Docker daemon
containerMode:
  type: "dind"

template:
  spec:
    automountServiceAccountToken: false
    restartPolicy: Never
    containers:
      - name: runner
        image: ghcr.io/yicong-huang/texera-arc-runner:latest
        imagePullPolicy: Always
        command:
          - /home/runner/run.sh
        resources:
          requests:
            cpu: "4"
            memory: "12Gi"
            ephemeral-storage: "15Gi"
          limits:
            cpu: "8"
            memory: "16Gi"
            ephemeral-storage: "25Gi"
